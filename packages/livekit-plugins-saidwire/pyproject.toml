[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-saidwire"
dynamic = ["version"]
description = "Saidwire real-time speech-to-text plugin for LiveKit Agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Saidwire", email = "support@saidwire.com" }]
keywords = [
    "webrtc",
    "realtime",
    "audio",
    "livekit",
    "livekit-agents",
    "saidwire",
    "stt",
    "speech-to-text",
    "streaming",
    "websocket",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["livekit-agents>=1.8.10", "aiohttp"]

[project.urls]
Documentation = "https://saidwire.com/docs/api"
Website = "https://saidwire.com"
Source = "https://github.com/SaidwireLLC/saidwire-integrations/tree/main/packages/livekit-plugins-saidwire"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.8", "mypy>=1.13", "numpy"]

[tool.hatch.version]
path = "livekit/plugins/saidwire/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["unit: fast tests with no external providers"]

# Same rule set as livekit/agents.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF006", "RUF018"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["livekit"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
disallow_any_generics = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-saidwire"
dynamic = ["version"]
description = "Saidwire real-time speech-to-text service for Pipecat"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saidwire", email = "support@saidwire.com" }]
keywords = ["pipecat", "speech-to-text", "stt", "asr", "voice-agent", "realtime", "saidwire"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pipecat-ai>=1.15,<2"]

[project.urls]
Homepage = "https://saidwire.com"
Documentation = "https://saidwire.com/docs/api"
Source = "https://github.com/SaidwireLLC/saidwire-integrations/tree/main/packages/pipecat-saidwire"
Issues = "https://github.com/SaidwireLLC/saidwire-integrations/issues"
Changelog = "https://github.com/SaidwireLLC/saidwire-integrations/blob/main/packages/pipecat-saidwire/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.8"]

[tool.hatch.version]
path = "src/pipecat_saidwire/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_saidwire"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# Same rule set as Pipecat itself.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "D", "F", "I", "RUF006", "UP"]
ignore = ["ASYNC109", "ASYNC110", "ASYNC240", "B024", "B027", "B007", "B904", "B905", "D105"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["D", "ASYNC230", "RUF006"]
"tests/**/*.py" = ["D", "ASYNC230", "RUF006"]
"**/__init__.py" = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"
